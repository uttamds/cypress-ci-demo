name: Cypress Tests

on:
  push:
    branches: [ main ]

jobs:
  cypress-run:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress
        run: npx cypress run