<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Storage Demo</title>
</head>
<body>

    <h2>Local Storage Demo</h2>

    <button onclick="saveData()">Store Value</button>
    <button onclick="readData()">Read Value</button>
    <button onclick="removeData()">Remove Value</button>
    <button onclick="clearData()">Clear Local Storage</button>

    <h3 id="output"></h3>

    <script>

        function saveData() {

            localStorage.setItem("username", "admin");

            document.getElementById("output").innerHTML =
                "Stored: username = admin";
        }

        function readData() {

            let value = localStorage.getItem("username");

            document.getElementById("output").innerHTML =
                "Read: " + value;
        }

        function removeData() {

            localStorage.removeItem("username");

            document.getElementById("output").innerHTML =
                "username removed";
        }

        function clearData() {

            localStorage.clear();

            document.getElementById("output").innerHTML =
                "Local Storage Cleared";
        }

    </script>

</body>
</html>
